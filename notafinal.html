<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calcule a nota final do vestibular da UFSC aplicando os pesos do curso escolhido.">
  <title>Nota Final UFSC</title>
  <meta property="og:title" content="Calculadora de Nota Final da UFSC">
  <meta property="og:description" content="Calcule a nota final do vestibular da UFSC aplicando os pesos do curso escolhido.">
  <meta name="keywords" content="UFSC, Calculadora UFSC, Nota Final UFSC, Calcular Nota Final, Vestibular UFSC, Pontuação UFSC">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://calculadoraufsc.mateusbertan.com/notafinal">
  <meta property="og:locale" content="pt_BR">
  <link rel="preload" href="css/main.css">
  <link rel="preload" href="css/notafinal.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <script type="module" src="js/utils/inputMasks.js"></script>
  <script type="module" src="js/notafinal.js"></script>
  <script src="js/utils/cursos.js"></script>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/notafinal.css">
</head>

<body>
  <nav>
    <ul>
      <li>
        <a href="/">Somatória</a>
      </li>
      <li>
        <a href="/notafinal.html">Nota Final</a>
      </li>
      <li>
        <a href="/simulado.html">Simulado</a>
      </li>
    </ul>
  </nav>
  <main>
    <section class="title">
      <h1>Calcular Nota Final UFSC</h1>
    </section>
    <section class="dados notaFinalContainer">
      <form class="form" id="form-notafinal">
        <section class="curso">
          <section class="campo">
            <label for="campus">Campus:</label>
            <select name="campus" id="campus">
              <option value="Florianópolis">Florianópolis</option>
              <option value="Curitibanos">Curitibanos</option>
              <option value="Joinville">Joinville</option>
              <option value="Araranguá">Araranguá</option>
              <option value="Blumenau">Blumenau</option>
            </select>
          </section>
          <section class="campo">
            <label for="curso">Curso:</label>
            <select name="curso" id="curso"></select>
          </section>
        </section>
        <section class="header">
          <p>Disciplina</p>
          <p class="center">Pontuação</p>
          <p class="center">Peso</p>
        </section>
        <section class="disciplina">
          <label for="pli">Primeira Língua:</label>
          <span class="input-span">
            <input
              type="text"
              class="input"
              name="pli"
              id="pli"
              min="0"
              max="12"
              required
              maskNota
            >
            <span class="nota-maxima">/12pts</span>
          </span>
          <p class="peso pli"></p>
        </section>
        <section class="disciplina">
          <label for="sli">Segunda Língua:</label>
          <span class="input-span">
            <input
              type="text"
              class="input"
              name="sli"
              id="sli"
              min="0"
              max="8"
              required
              maskNota
            >
            <span class="nota-maxima">/08pts</span>
          </span>
          <p class="peso sli"></p>
        </section>
        <section class="disciplina">
          <label for="mtm">Matemática:</label>
          <span class="input-span">
            <input
              type="text"
              class="input"
              name="mtm"
              id="mtm"
              min="0"
              max="10"
              required
              maskNota
            >
            <span class="nota-maxima">/10pts</span>
          </span>
          <p class="peso mtm"></p>
        </section>
        <section class="disciplina">
          <label for="blg">Biologia:</label>
          <span class="input-span">
            <input
              type="text"
              class="input"
              name="blg"
              id="blg"
              min="0"
              max="10"
              required
              maskNota
            >
            <span class="nota-maxima">/10pts</span>
          </span>
          <p class="peso blg"></p>
        </section>
        <section class="disciplina">
          <label for="chs">Ciências Humanas:</label>
          <span class="input-span">
            <input 
              type="text"
              class="input"
              name="chs"
              id="chs"
              min="0"
              max="20"
              required
              maskNota
            >
            <span class="nota-maxima">/20pts</span>
          </span>
          <p class="peso chs"></p>
        </section>
        <section class="disciplina">
          <label for="fsc">Física:</label>
          <span class="input-span">
            <input
              type="text"
              class="input"
              name="fsc"
              id="fsc"
              min="0"
              max="10"
              required
              maskNota
            >
            <span class="nota-maxima">/10pts</span>
          </span>
          <p class="peso fsc"></p>
        </section>
        <section class="disciplina">
          <label for="qmc">Química:</label>
          <span class="input-span">
            <input
              type="text"
              class="input"
              name="qmc"
              id="qmc"
              min="0"
              max="10"
              required
              maskNota
            >
            <span class="nota-maxima">/10pts</span>
          </span>
          <p class="peso qmc"></p>
        </section>
        <section class="disciplina">
          <label for="dsc">Discursivas:</label>
          <span class="input-span">
            <input
              type="text"
              class="input"
              name="dsc"
              id="dsc"
              min="0"
              max="10"
              required
              maskNota
            >
            <span class="nota-maxima">/10pts</span>
          </span>
          <p class="peso dsc"></p>
        </section>
        <section class="disciplina">
          <label for="rdc">Redação:</label>
          <span class="input-span">
            <input
              type="text"
              class="input"
              name="rdc"
              id="rdc"
              min="0"
              max="10"
              required
              maskNota
            >
            <span class="nota-maxima">/10pts</span>
          </span>
          <p class="peso rdc"></p>
        </section>
        <input class="submit" type="submit" value="Calcular">
      </form>
    </section>
    <section class="resultado">
      <p id="notafinal"></p>
      <p id="pontuacaocompesos"></p>
      <p id="pontuacaosempesos"></p>
    </section>
  </main>
  <footer>
    <p>Desenvolvido por <a href="https://github.com/mateusbertan" target="_blank">Mateus Bertan</a></p>
  </footer>
</body>

</html>
