<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calcule a pontuação de questões de somatório da UFSC seguindo a fórmula oficial de forma fácil.">
  <title>Somatório UFSC</title>
  <meta property="og:title" content="Calculadora de Somatório da UFSC">
  <meta property="og:description" content="Calcule a pontuação de questões de Somatório da UFSC seguindo a fórmula oficial de forma fácil.">
  <meta name="keywords" content="UFSC, somatório UFSC, calculadora UFSC, vestibular UFSC, pontuação UFSC, cálculo somatório, simulador UFSC, questão somatório">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://calculadoraufsc.mateusbertan.com/">
  <meta property="og:locale" content="pt_BR">
  <link rel="canonical" href="https://calculadoraufsc.mateusbertan.com/">
  <link rel="preload" href="css/main.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <script type="module" src="js/utils/inputMasks.js"></script>
  <script type="module" src="js/somatorio.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <nav>
    <ul>
      <li>
        <a rel="Página para cálculo da pontuação de questões de somatório" href="/">Somatório</a>
      </li>
      <li>
        <a rel="Página para cálculo da nota final" href="/notafinal.html">Nota Final</a>
      </li>
      <li>
        <a rel="Página para simulado de provas antigas" href="/simulado.html">Simulado</a>
      </li>
    </ul>
  </nav>
  <main>
    <section class="title">
      <h1>Calcular Somatório UFSC</h1>
    </section>
    <section class="dados">
      <form class="form" id="form-somatorio">
        <section class="soma">
          <label for="soma">Soma:</label>
          <input
            type="number"
            id="soma"
            name="soma"
            min="1" 
            max="99"
            maxlength="2"
            placeholder="Ex.: 38"
            required
            maskSoma
          >
        </section>
        <section class="gabarito">
          <label for="gabarito">Gabarito:</label>
          <input
            type="number"
            id="gabarito"
            name="gabarito"
            min="1"
            max="99"
            maxlength="2"
            placeholder="Ex.: 36"
            required
            maskSoma
          >
        </section>
        <section class="quantidade">
          <label for="quantidade">Maior proposição:</label>
          <select name="quantidade" id="quantidade">
            <option value="7">64</option>
            <option value="6">32</option>
            <option value="5">16</option>
            <option value="4">8</option>
            <option value="3">4</option>
          </select>
        </section>
        <input class="submit" type="submit" value="Calcular">
      </form>
    </section>
    <section class="resultado">
      <p id="pontuacao"></p>
      <p id="assinaladas"></p>
      <p id="corretas"></p>
      <p id="incorretas"></p>
    </section>
  </main>
  <footer>
    <p>Desenvolvido por <a rel="Github do desenvolvedor" href="https://github.com/mateusbertan" target="_blank">Mateus Bertan</a></p>
  </footer>
</body>

</html>
